name: Build, Test & Deploy APK to Firebase App Distribution

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Test, Build Debug APK & Distribute
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore google-services.json from GitHub Secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          elif [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
          elif [ ! -f app/google-services.json ]; then
            echo "::error::Missing app/google-services.json. Add GOOGLE_SERVICES_JSON or GOOGLE_SERVICES_JSON_BASE64 in repository secrets."
            exit 1
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Installable Debug APK
        env:
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: routeguard-native-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare Release Notes
        id: meta
        run: |
          NOTES="Branch: ${GITHUB_REF_NAME} | Commit: ${GITHUB_SHA::7} - $(git log -1 --pretty=%s)"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Check Firebase App Distribution Credentials
        id: firebase_check
        env:
          HAS_SA: ${{ secrets.FIREBASE_SERVICE_CREDENTIALS != '' }}
        run: |
          if [ "$HAS_SA" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::FIREBASE_SERVICE_CREDENTIALS secret is not configured. Skipping Firebase App Distribution upload (APK is still available in GitHub Actions Artifacts)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload APK to Firebase App Distribution
        if: steps.firebase_check.outputs.enabled == 'true'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          app: ${{ secrets.FIREBASE_APP_ID != '' && secrets.FIREBASE_APP_ID || '1:447657870033:android:0a0328e0e280b676c4fbf0' }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_CREDENTIALS }}
          groups: ${{ vars.FIREBASE_TESTER_GROUPS != '' && vars.FIREBASE_TESTER_GROUPS || 'testers' }}
          releaseNotes: ${{ steps.meta.outputs.notes }}
          file: app/build/outputs/apk/debug/app-debug.apk
